version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - openjdk-21-jdk-headless   # match your project's Java version
    - maven
  jobs:
    install:
      - pip install -r docs/requirements.txt
    build:
      html:
        - zensical build --clean
        - mvn -B -DskipTests javadoc:javadoc
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
      - cp --recursive target/reports/apidocs $READTHEDOCS_OUTPUT/html/javadoc

mkdocs:
  configuration: mkdocs.yml